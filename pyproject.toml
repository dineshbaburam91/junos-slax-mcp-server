[project]
name = "junos-slax-mcp-server"
version = "0.1.0"
description = "MCP server that answers Junos XML RPC and SLAX scripting questions from the Juniper Day One PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27.0",
    "pypdf>=5.1.0",
    "beautifulsoup4>=4.12.0",
    "truststore>=0.9.0",
    "junos-mcp-server>=1.1.0",
]

[project.scripts]
junos-slax-mcp-server = "main:main"

# junos-mcp-server is not published to PyPI; install it from its Git repo.
# For a local dev checkout, override with a path source, e.g.:
#   [tool.uv.sources]
#   junos-mcp-server = { path = "../junos-mcp-server", editable = true }
[tool.uv.sources]
junos-mcp-server = { git = "https://github.com/Juniper/junos-mcp-server.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "network: integration tests that download the reference sources",
]
